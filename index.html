// ================= SOM (Web Audio API - sem nenhum arquivo de áudio) =================

let audioCtx = null;

function iniciarAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { audioCtx = null; }
}

const COMPENSACAO_ONDA = { square: 0.6, triangle: 1.0, sawtooth: 0.85 };

function tocarTom(frequencia, duracao, tipoOnda, atraso, volume) {
  if (!CONFIG.som || !audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  try {
    const tipo = tipoOnda || CONFIG.onda;
    const osc = audioCtx.createOscillator();
    const ganho = audioCtx.createGain();
    osc.type = tipo;
    osc.frequency.value = frequencia;
    const inicio = audioCtx.currentTime + (atraso || 0);
    const pico = (volume || 0.18) * (COMPENSACAO_ONDA[tipo] || 1);
    ganho.gain.setValueAtTime(pico, inicio);
    ganho.gain.exponentialRampToValueAtTime(0.001, inicio + duracao);
    osc.connect(ganho).connect(audioCtx.destination);
    osc.start(inicio);
    osc.stop(inicio + duracao);
  } catch (e) {}
}

function somTecla() { tocarTom(1046, 0.03); }
function somConfirmar() { tocarTom(660, 0.05); }
function somAcerto() { tocarTom(523, 0.09); tocarTom(659, 0.09, null, 0.09); tocarTom(784, 0.2, null, 0.18); }
function somErro() { tocarTom(392, 0.14, null, 0, 0.26); tocarTom(311, 0.14, null, 0.14, 0.26); tocarTom(233, 0.4, null, 0.28, 0.26); }
function somPreviaOnda() { tocarTom(440, 0.14); tocarTom(554, 0.14, null, 0.14); tocarTom(659, 0.22, null, 0.28); }

let ALUNO_ATUAL = null;
let ALUNO_TURMA = null;
let ALUNO_REGISTRA = false;

let listaTrilhas = ["Sem música"];

async function carregarTrilhas() {

function aplicarTrilha() {

  } else {
    player.loop = true;

}

function mudarTrilha(direcao) {

  aplicarTrilha();
}

const elementoTrilha = document.getElementById("trilha");

// ================= RESULTADO (Firebase Firestore - tempo real) =================

function idDocumentoResultado(quiz, aluno) {
  return quiz + "__" + String(aluno).replace(/[^a-zA-Z0-9À-ÿ]/g, "_");
}

async function jaRespondeuQuiz(quiz, aluno) {
  if (!window.firebasePronto) return false;
  try {
    const ref = window.firestoreDoc(window.firestoreDB, "resultados", idDocumentoResultado(quiz, aluno));
    const snap = await window.firestoreGetDoc(ref);
    if (!snap.exists()) return false;
    const d = snap.data() || {};
    if (!Array.isArray(d.respostas)) return false;
    return d.status === "andamento" ? "andamento" : "concluido";
  } catch (e) {
    return false;
  }
}

async function gravarTentativa(quiz, campos) {
  if (!ALUNO_REGISTRA) return null;
  if (!window.firebasePronto) { console.error("Firebase não está pronto."); return false; }
  try {
    const ref = window.firestoreDoc(window.firestoreDB, "resultados", idDocumentoResultado(quiz, ALUNO_ATUAL));
    await window.firestoreSetDoc(ref, campos, { merge: true });
    return true;
  } catch (e) { console.error("Erro ao gravar tentativa:", e); return false; }
}

async function enviarResultado(quiz, gabarito, respostas, acertos, nota, cfg, atingiuMeta) {
  if (!ALUNO_REGISTRA) return null;
  if (!window.firebasePronto) { console.error("Firebase não está pronto."); return false; }
  try {
    const ref = window.firestoreDoc(window.firestoreDB, "resultados", idDocumentoResultado(quiz, ALUNO_ATUAL));
    await window.firestoreSetDoc(ref, {
      quiz: quiz, turma: ALUNO_TURMA, aluno: ALUNO_ATUAL,
      gabarito: gabarito, respostas: respostas,
      acertos: acertos, nota: nota, config: cfg, atingiuMeta: !!atingiuMeta,
      status: "concluido", saidas: SAIDAS_QUIZ, data: new Date().toISOString(),
    }, { merge: true });
    return true;
  } catch (e) { console.error("Erro ao enviar resultado:", e); return false; }
}

// ================= UTIL: DIGITAR =================

function pausar(ms) { return new Promise(r => setTimeout(r, ms)); }

let PULAR_TELA = false;
let removerSkip = null;

function armarSkip() {
  if (removerSkip) removerSkip();
  const aoInteragir = () => { PULAR_TELA = true; };
  const timer = setTimeout(() => {
    document.addEventListener("click", aoInteragir);
    document.addEventListener("keydown", aoInteragir);
  }, 150);
  removerSkip = () => {
    clearTimeout(timer);
    document.removeEventListener("click", aoInteragir);
    document.removeEventListener("keydown", aoInteragir);
  };
}

async function digitar(container, texto, classe) {
  const span = document.createElement("span");
  if (classe) span.className = classe;
  container.appendChild(span);

  if (PULAR_TELA || CONFIG.velocidade === 0) { span.textContent = texto; return span; }

  let contador = 0;
  for (const letra of texto) {
    if (PULAR_TELA) { span.textContent = texto; break; }
    span.textContent += letra;
    contador++;
    if (contador % 2 === 0) somTecla();
    await pausar(CONFIG.velocidade);
  }
  return span;
}

async function digitarParagrafo(container, texto, classe) {
  const p = document.createElement("p");
  container.appendChild(p);
  await digitar(p, String(texto).replace(/\s+$/, ""), classe);
}

async function desenharArte(corpo, linhas) {
  linhas = linhas.map(l => l.replace(/\s+$/, ""));
  while (linhas.length && linhas[linhas.length - 1] === "") linhas.pop();
  if (!linhas.length) return;
  const pre = document.createElement("pre");
  pre.className = "arte";
  corpo.appendChild(pre);
  const maxLen = Math.max(1, ...linhas.map(l => l.length));
  const largura = corpo.clientWidth || 320;
  pre.style.fontSize = Math.max(4, Math.min(15, Math.floor(largura / (maxLen * 0.6) * 10) / 10)) + "px";
  if (CONFIG.velocidade === 0 || PULAR_TELA) { pre.textContent = linhas.join("\n"); return; }
  for (let k = 0; k < linhas.length; k++) {
    if (PULAR_TELA) { pre.textContent = linhas.join("\n"); return; }
    pre.textContent = linhas.slice(0, k + 1).join("\n");
    await pausar(35);
  }
}

// Lê um texto de tela (.txt): linhas seguidas viram um parágrafo (versos mantêm a quebra),
// linha em branco separa parágrafos e o trecho entre [arte] e [/arte] é desenhado sem alterar espaços.
async function mostrarTextoTela(corpo, texto) {
  const linhas = texto.split(/\r\n|\r|\n/);
  let par = [];
  const soltar = async () => { if (par.length) { const t = par.join("\n"); par = []; await digitarParagrafo(corpo, t); } };
  for (let i = 0; i < linhas.length; i++) {
    const marca = linhas[i].trim().toLowerCase();
    if (marca === "[arte]") {
      await soltar();
      const bloco = [];
      i++;
      while (i < linhas.length && linhas[i].trim().toLowerCase() !== "[/arte]") { bloco.push(linhas[i]); i++; }
      await desenharArte(corpo, bloco);
    } else if (marca === "") {
      await soltar();
    } else {
      par.push(linhas[i].trim());
    }
  }
  await soltar();
}

function linhaOrnamento(caractere) {
  const div = document.createElement("div");
  div.className = "linha-topo";
  div.textContent = caractere.repeat(LARGURA);
  return div;
}

function cabecalho(titulo) {
  PULAR_TELA = false;
  armarSkip();
  const tela = document.getElementById("tela");
  tela.innerHTML = "";
  tela.appendChild(linhaOrnamento("="));
  const h1 = document.createElement("h1");
  h1.className = "cabecalho";
  h1.textContent = titulo;
  tela.appendChild(h1);
  tela.appendChild(linhaOrnamento("="));
  const corpo = document.createElement("div");
  corpo.className = "corpo";
  tela.appendChild(corpo);
  return corpo;
}

function criarBotao(html, aoClicar, selecionada, opcoes) {
  const config = opcoes || {};
  const botao = document.createElement("button");
  botao.className = "opcao" + (selecionada ? " selecionada" : "");
  botao.innerHTML = html;
  botao.onclick = (ev) => {
    ev.stopPropagation();
    if (config.podeClicar && !config.podeClicar()) return;
    if (!config.semSom) somConfirmar();
    aoClicar();
  };
  return botao;
}

// ================= FETCH DE ARQUIVOS =================

async function buscarTexto(caminho) {
  const resposta = await fetch(caminho, { cache: "no-store" });
  if (!resposta.ok) throw new Error("Não encontrei: " + caminho);
  return await resposta.text();
}

async function buscarLista(caminho) {
  const texto = await buscarTexto(caminho);
  return texto.split(/\r\n|\r|\n/).map(l => l.trim()).filter(l => l !== "");
}

// ================= PARSER DE QUESTÕES =================

function carregarQuestoes(texto) {
  const linhas = texto.split(/\r\n|\r|\n/).map(l => l.trim());
  const questoes = [];
  let questao = { textos: [], item: "", alternativas: [], resposta: "" };
  let marcador = "";
  const padraoAlternativa = /^([A-Ea-e1-5])\s*[)\.:\-]\s*(.*)$/;

  for (const linha of linhas) {
    if (linha === "===") {
      if (questao.item !== "") questoes.push(questao);
      questao = { textos: [], item: "", alternativas: [], resposta: "" };
      marcador = "";
    } else if (linha === "TEXTO:") {
      marcador = "texto";
      questao.textos.push("");
    } else if (linha === "ITEM:") {
      marcador = "item";
      questao.item = "";
    } else if (padraoAlternativa.test(linha)) {
      marcador = "alternativa";
      const m = linha.match(padraoAlternativa);
      questao.alternativas.push({ rotulo: m[1], texto: m[2].trim() });
    } else if (linha === "RESPOSTA:") {
      marcador = "resposta";
    } else if (linha === "") {
      if (marcador === "texto" && questao.textos[questao.textos.length - 1] !== "") {
        questao.textos[questao.textos.length - 1] += "\n";
      } else if (marcador === "item" && questao.item !== "") {
        questao.item += "\n";
      }
    } else {
      if (marcador === "texto") {
        const i = questao.textos.length - 1;
        questao.textos[i] = questao.textos[i] === "" ? linha : questao.textos[i] + "\n" + linha;
      } else if (marcador === "item") {
        questao.item = questao.item === "" ? linha : questao.item + "\n" + linha;
      } else if (marcador === "alternativa") {
        const i = questao.alternativas.length - 1;
        questao.alternativas[i].texto = questao.alternativas[i].texto === "" ? linha : questao.alternativas[i].texto + "\n" + linha;
      } else if (marcador === "resposta") {
        questao.resposta = questao.resposta === "" ? linha : questao.resposta + "\n" + linha;
      }
    }
  }
  if (questao.item !== "") questoes.push(questao);
  return questoes;
}

const MAPA_POSICAO_LETRA = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E" };

function normalizarAlternativa(valor) {
  if (!valor) return null;
  valor = valor.trim().toUpperCase().replace(/[.):\s\-]/g, "");
  if (valor === "") return null;
  const mapa = { A: "1", B: "2", C: "3", D: "4", E: "5" };
  if (mapa[valor]) return mapa[valor];
  if (/^\d+$/.test(valor)) return valor;
  return null;
}

function embaralhar(lista) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// ================= LOGIN (TURMAS/ALUNOS) =================

let turmasCache = null;

async function carregarTurmasCache() {
  if (turmasCache) return turmasCache;
  turmasCache = [];
  try {
    const linhas = await buscarLista("turmas/turmas.txt");
    for (const linha of linhas) {
      const partes = linha.split(" - ").map(p => p.trim());
      if (partes.length >= 2 && partes[1].toLowerCase().endsWith(".txt")) {
        turmasCache.push({ titulo: partes[0], arquivo: partes[1], senha: partes.length >= 3 ? partes[2] : null });
      } else if (partes.length === 2) {
        turmasCache.push({ titulo: partes[0], arquivo: null, senha: partes[1] });
      } else {
        turmasCache.push({ titulo: partes[0], arquivo: null, senha: null });
      }
    }
  } catch (e) { turmasCache = []; }
  return turmasCache;
}

async function carregarRoster(arquivo) {
  let alunos = [];
  try {
    const linhas = await buscarLista("turmas/" + arquivo);
    for (const linha of linhas) {
      if (linha.includes(" - ")) {
        const [nome, senha] = linha.split(" - ").map(s => s.trim());
        alunos.push({ nome, senha });
      } else {
        alunos.push({ nome: linha, senha: null });
      }
    }
  } catch (e) { alunos = []; }
  return alunos;
}

async function telaSenha(senhaEsperada, aoAcertar, aoCancelar) {
  const corpo = cabecalho("Senha");
  await digitarParagrafo(corpo, "Digite sua senha:");

  const campo = document.createElement("input");
  campo.type = "text";
  campo.inputMode = "numeric";
  campo.autocomplete = "off";
  corpo.appendChild(campo);
  setTimeout(() => campo.focus(), 50);

  const mensagemErro = document.createElement("p");
  mensagemErro.className = "erro-texto";
  corpo.appendChild(mensagemErro);

  const confirmar = () => {
    if (campo.value.trim() === senhaEsperada) {
      somConfirmar();
      aoAcertar();
    } else {
      somErro();
      mensagemErro.textContent = "Senha incorreta. Tente novamente.";
      campo.value = "";
      campo.focus();
    }
  };

  campo.onkeydown = (ev) => { if (ev.key === "Enter") confirmar(); };
  corpo.appendChild(criarBotao("Confirmar", confirmar, false, { semSom: true }));
  corpo.appendChild(criarBotao("Voltar", aoCancelar));
}


function abrirProfessor() {
  const erroPainel = async (msg) => {
    const corpo = cabecalho("Professor");
    await digitarParagrafo(corpo, msg, "erro-texto");
    corpo.appendChild(criarBotao("Voltar", telaLogin));
  };
  const iniciar = () => {
    if (typeof window.telaProfessor !== "function") { erroPainel("O professor.js carregou, mas está incompleto ou desatualizado. Reenvie o arquivo professor.js ao GitHub."); return; }
    try { window.telaProfessor(); } catch (e) { erroPainel("O painel deu erro ao iniciar: " + e.message); }
  };
  if (window.telaProfessor) { iniciar(); return; }
  const s = document.createElement("script");
  s.src = "professor.js?v=" + Date.now();
  s.onload = iniciar;
  s.onerror = () => erroPainel("Não consegui carregar o painel (professor.js).");
  document.body.appendChild(s);
}

async function telaLogin() {
  const corpo = cabecalho("Login");
  const turmas = await carregarTurmasCache();

  if (turmas.length === 0) {
    await digitarParagrafo(corpo, "Nenhuma turma cadastrada ainda.", "erro-texto");
    corpo.appendChild(criarBotao("Continuar sem login", () => {
      ALUNO_ATUAL = null; ALUNO_TURMA = null; ALUNO_REGISTRA = false;
      telaMenu();

  for (const turma of turmas) {

function selecionarTurma(turma) {
  if (turma.senha) {
    telaSenha(turma.senha, () => prosseguirTurma(turma), telaLogin);
  } else {
    prosseguirTurma(turma);
  }
}

function ehProfessor(turma) {
  return turma.arquivo === null && turma.titulo.trim().toLowerCase() === "professor";
}

async function prosseguirTurma(turma) {
  if (ehProfessor(turma)) {
    if (!turma.senha) {
      const corpo = cabecalho("Professor");
      await digitarParagrafo(corpo, "Defina uma senha em turmas.txt, assim: Professor - 123456", "erro-texto");
      corpo.appendChild(criarBotao("Voltar", telaLogin));
      return;
    }
    ALUNO_ATUAL = null; ALUNO_TURMA = null; ALUNO_REGISTRA = false;
    abrirProfessor();
    return;
  }
  if (turma.arquivo === null) {
    ALUNO_ATUAL = turma.titulo;
    ALUNO_TURMA = null;
    ALUNO_REGISTRA = false;
    telaMenu();
    return;
  }
  const roster = await carregarRoster(turma.arquivo);
  telaAlunos(turma, roster);
}

async function telaAlunos(turma, roster) {
  const corpo = cabecalho(turma.titulo);

  if (roster.length === 0) {
    await digitarParagrafo(corpo, "Essa turma não tem alunos cadastrados.", "erro-texto");
    corpo.appendChild(criarBotao("Voltar", telaLogin));
    return;
  }

  for (const aluno of roster) {
    corpo.appendChild(criarBotao('<span class="rotulo">›</span>' + aluno.nome, () => selecionarAluno(turma, aluno, roster)));
  }
  corpo.appendChild(criarBotao("Voltar", telaLogin));
}

function selecionarAluno(turma, aluno, roster) {
  if (aluno.senha) {
    telaSenha(aluno.senha, () => confirmarLogin(turma, aluno), () => telaAlunos(turma, roster));
  } else {
    confirmarLogin(turma, aluno);
  }
}

// ================= SESSÃO (controle de sala em tempo real) =================

let intervaloHeartbeat = null;
let pararEscutaBloqueio = null;

function idSessao(aluno) {
  return String(aluno).replace(/[^a-zA-Z0-9À-ÿ]/g, "_");
}

let QUIZ_ATIVO = false, SAIDAS_QUIZ = 0, EMPILHADOS = 0, FORA_DO_APP = false;

function avisoTemporario(texto) {
  let el = document.getElementById("aviso-temp");
  if (!el) {
    el = document.createElement("div");
    el.id = "aviso-temp";
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:18px;background:var(--fundo-caixa);border:1px solid var(--erro);color:var(--erro);padding:10px 12px;font-size:14px;z-index:50;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = texto;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 3000);
}

function registrarPresenca(fora) {
  if (fora === FORA_DO_APP) return;
  FORA_DO_APP = fora;
  if (!ALUNO_REGISTRA || !ALUNO_ATUAL) return;
  if (fora && QUIZ_ATIVO) SAIDAS_QUIZ++;
  atualizarProgresso({ fora: fora, saidas: SAIDAS_QUIZ });
}

function iniciarQuizAtivo() {
  QUIZ_ATIVO = true;
  SAIDAS_QUIZ = 0;
  try { history.pushState(null, "", location.href); EMPILHADOS++; } catch (e) {}
}

function encerrarQuizAtivo() {
  QUIZ_ATIVO = false;
  if (EMPILHADOS > 0) {
    const n = EMPILHADOS;
    EMPILHADOS = 0;
    try { history.go(-n); } catch (e) {}
  }
}

document.addEventListener("visibilitychange", () => registrarPresenca(document.visibilityState === "hidden"));
window.addEventListener("pagehide", () => registrarPresenca(true));
window.addEventListener("pageshow", () => registrarPresenca(false));
window.addEventListener("popstate", () => {
  if (!QUIZ_ATIVO) return;
  try { history.pushState(null, "", location.href); EMPILHADOS++; } catch (e) {}
  avisoTemporario("Quiz em andamento: use os botões do jogo.");
});

function atualizarProgresso(campos) {
  if (!ALUNO_REGISTRA || !ALUNO_ATUAL || !window.firebasePronto) return;
  try {
    const ref = window.firestoreDoc(window.firestoreDB, "sessoes", idSessao(ALUNO_ATUAL));
    window.firestoreSetDoc(ref, { ...campos, ultimoPing: new Date().toISOString() }, { merge: true }).catch(() => {});
  } catch (e) {}
}

async function verificarSessaoAtiva(aluno) {
  if (!window.firebasePronto) return null;
  try {
    const ref = window.firestoreDoc(window.firestoreDB, "sessoes", idSessao(aluno));
    const snap = await window.firestoreGetDoc(ref);
    if (!snap.exists()) return null;
    const dados = snap.data();
    const ultimoPing = dados.ultimoPing ? new Date(dados.ultimoPing).getTime() : 0;
    const segundosParado = (Date.now() - ultimoPing) / 1000;
    if (dados.ativo && segundosParado < 60) return dados;
    return null;
  } catch (e) {
    console.error("Erro ao verificar sessão ativa:", e);
    return null;
  }
}

async function abrirSessao(aluno, turma) {
  encerrarEscutaLocal();

  if (!window.firebasePronto) return;

  try {
    const ref = window.firestoreDoc(window.firestoreDB, "sessoes", idSessao(aluno));
    await window.firestoreSetDoc(ref, {
      aluno: aluno,
      turma: turma || "",
      entrou: new Date().toISOString(),
      ultimoPing: new Date().toISOString(),
      ativo: true,
      bloqueado: false,
    });

    intervaloHeartbeat = setInterval(() => {
      window.firestoreSetDoc(ref, { ultimoPing: new Date().toISOString() }, { merge: true }).catch(() => {});
    }, 20000);

    pararEscutaBloqueio = window.firestoreOnSnapshot(ref, (snap) => {
      const dados = snap.data();
      if (dados && dados.bloqueado) encerrarPorBloqueio();
    });
  } catch (e) {
    console.error("Erro ao abrir sessão:", e);
  }
}

let pararEspera = null;
function cancelarEspera() { if (pararEspera) { pararEspera(); pararEspera = null; } }

function encerrarEscutaLocal() {
  cancelarEspera();
  if (intervaloHeartbeat) { clearInterval(intervaloHeartbeat); intervaloHeartbeat = null; }
  if (pararEscutaBloqueio) { pararEscutaBloqueio(); pararEscutaBloqueio = null; }
}

async function sairDaSessao() {
  const alunoAnterior = ALUNO_ATUAL;
  encerrarEscutaLocal();
  if (alunoAnterior && window.firebasePronto) {
    try {
      const ref = window.firestoreDoc(window.firestoreDB, "sessoes", idSessao(alunoAnterior));
      await window.firestoreSetDoc(ref, { ativo: false }, { merge: true });
    } catch (e) {}
  }
  telaLogin();
}

async function encerrarPorBloqueio() {
  encerrarEscutaLocal();
  const corpo = cabecalho("Sessão encerrada");
  await digitarParagrafo(corpo, "O professor encerrou sua sessão.", "erro-texto");
  corpo.appendChild(criarBotao("Voltar ao login", telaLogin));
}

async function perfilBloqueado(aluno) {
  if (!window.firebasePronto) return false;
  try {
    const snap = await window.firestoreGetDoc(window.firestoreDoc(window.firestoreDB, "sessoes", idSessao(aluno)));
    return snap.exists() && snap.data().bloqueado === true;
  } catch (e) { return false; }
}

async function confirmarLogin(turma, aluno) {
  if (await perfilBloqueado(aluno.nome)) {
    const corpoB = cabecalho("Login");
    await digitarParagrafo(corpoB, "Este perfil está bloqueado pelo professor.", "erro-texto");
    corpoB.appendChild(criarBotao("Voltar", telaLogin));
    return;
  }
  const sessaoExistente = await verificarSessaoAtiva(aluno.nome);
  if (sessaoExistente) {
    const corpo = cabecalho("Login");
    await digitarParagrafo(corpo, "Esse perfil já está em uso em outro aparelho agora.", "erro-texto");
    await digitarParagrafo(corpo, "Avise o professor antes de continuar.");
    corpo.appendChild(criarBotao("Tentar mesmo assim", () => prosseguirLoginConfirmado(turma, aluno)));
    corpo.appendChild(criarBotao("Voltar", telaLogin));
    return;
  }
  prosseguirLoginConfirmado(turma, aluno);
}

function prosseguirLoginConfirmado(turma, aluno) {
  ALUNO_ATUAL = aluno.nome;
  ALUNO_TURMA = turma.titulo;
  ALUNO_REGISTRA = true;
  abrirSessao(aluno.nome, turma.titulo);
  telaMenu();
}

const CONFIG_PADRAO = { ordem: "aleatoria", pontuacao: "dez", tempo: 0, modo: "normal", ganho: 1, perda: 1, meta: 10 };

async function carregarConfigQuiz(nome) {
  const cfg = Object.assign({}, CONFIG_PADRAO);
  if (!window.firebasePronto) return cfg;
  try {
    const snap = await window.firestoreGetDoc(window.firestoreDoc(window.firestoreDB, "configuracoes", nome));
    if (snap.exists()) Object.assign(cfg, snap.data());
  } catch (e) { console.error("Erro ao ler configuração do quiz:", e); }
  if (cfg.modo === "arriscar") cfg.modo = "desafio";
  return cfg;
}

function fmt(n) { return String(Math.round(n * 100) / 100); }

function pontuarQuestao(cfg, total, resultado) {
  if (resultado === "acertou") return cfg.modo === "desafio" ? cfg.ganho : (cfg.pontuacao === "dez" ? 10 / total : 1);
  if (resultado === "errou" && cfg.modo === "desafio") return -cfg.perda;
  return 0;
}

async function telaQuiz(arquivo) {
  const nomeQuiz = arquivo.replace(".txt", "");
  const corpo = cabecalho("Quiz Literário");
  let perguntas;
  try {
    perguntas = carregarQuestoes(await buscarTexto("perguntas/" + arquivo));
  } catch (e) {
    await digitarParagrafo(corpo, "Não consegui carregar esse quiz.", "erro-texto");
    return;
  }
  if (perguntas.length === 0) {
    await digitarParagrafo(corpo, "Nenhuma pergunta encontrada nesse arquivo.", "erro-texto");
    return;
  }

  const cfg = await carregarConfigQuiz(nomeQuiz);
  const desafio = cfg.modo === "desafio";

  perguntas.forEach((q, i) => { q.indiceOriginal = i; });
  const total = perguntas.length;
  const ordem = cfg.ordem === "sequencial" ? perguntas.slice() : embaralhar(perguntas);
  const gabaritoLista = perguntas.map(q => MAPA_POSICAO_LETRA[normalizarAlternativa(q.resposta)] || "?");
  const respostasLista = new Array(total).fill("-");
  let pontos = 0;
  let acertos = 0;
  let atingiuMeta = false;
  const erros = [];

  const fila = ordem.slice();
  const inicioOk = await gravarTentativa(nomeQuiz, {
    quiz: nomeQuiz, turma: ALUNO_TURMA, aluno: ALUNO_ATUAL,
    gabarito: gabaritoLista, respostas: respostasLista.slice(),
    acertos: 0, nota: 0, config: cfg, atingiuMeta: false,
    status: "andamento", inicio: new Date().toISOString(), data: new Date().toISOString(),
  });
  if (inicioOk === false) {
    await digitarParagrafo(corpo, "Não consegui registrar o início do quiz. Verifique a internet e tente de novo.", "erro-texto");
    corpo.appendChild(criarBotao("Voltar", telaCategorias));
    return;
  }
  iniciarQuizAtivo();
  atualizarProgresso({ quizAtual: nomeQuiz, acao: "lendo", pontos: 0, acertos: 0, total: total, modo: cfg.modo, fora: false, saidas: 0 });

  while (fila.length > 0) {
    const questao = fila.shift();
    const corpoQ = cabecalho("Quiz Literário");
    atualizarProgresso({ acao: "lendo" });

    const status = document.createElement("p");
    status.className = "destaque-texto";
    status.textContent = desafio
      ? `Pontos: ${fmt(pontos)} (meta ${cfg.meta}) — restam ${fila.length + 1} ${fila.length === 0 ? "questão" : "questões"}`
      : `Questão ${total - fila.length} de ${total} — ${cfg.pontuacao === "dez" ? "Nota" : "Pontos"} atual: ${fmt(pontos)}`;
    corpoQ.appendChild(status);

    let linhaTempo = null;
    if (cfg.tempo > 0) {
      linhaTempo = document.createElement("p");
      linhaTempo.className = "destaque-texto";
      linhaTempo.textContent = `Tempo: ${cfg.tempo}s`;
      corpoQ.appendChild(linhaTempo);
    }
    corpoQ.appendChild(linhaOrnamento("-"));

    for (const texto of questao.textos) {
      if (texto.trim() !== "") await digitarParagrafo(corpoQ, texto);
    }
    await digitarParagrafo(corpoQ, questao.item, "destaque-texto");

    let liberado = false;
    let resolverResposta;
    const promessaResposta = new Promise(r => { resolverResposta = r; });
    const blocos = [];
    for (const alternativa of questao.alternativas) {
      const botao = criarBotao('<span class="rotulo"></span><span class="texto-alt"></span>', () => resolverResposta(alternativa.rotulo), false, { podeClicar: () => liberado });
      botao.querySelector(".rotulo").textContent = alternativa.rotulo;
      corpoQ.appendChild(botao);
      blocos.push({ botao, alternativa });
    }
    if (desafio) {
      corpoQ.appendChild(criarBotao("Pular", () => resolverResposta("PULAR"), false, { podeClicar: () => liberado }));
    }
    for (const bloco of blocos) {
      await digitar(bloco.botao.querySelector(".texto-alt"), bloco.alternativa.texto);
    }
    liberado = true;

    let relogio = null;
    if (linhaTempo) {
      let restante = cfg.tempo;
      relogio = setInterval(() => {
        restante--;
        linhaTempo.textContent = `Tempo: ${restante}s`;
        if (restante <= 0) { clearInterval(relogio); resolverResposta("TEMPO"); }
      }, 1000);
    }
    const respostaEscolhida = await promessaResposta;
    if (relogio) clearInterval(relogio);

    let resultado;
    if (respostaEscolhida === "PULAR") { resultado = "pulou"; respostasLista[questao.indiceOriginal] = "P"; }
    else if (respostaEscolhida === "TEMPO") { resultado = desafio ? "pulou" : "tempo"; respostasLista[questao.indiceOriginal] = "T"; }
    else {
      const respostaUsuario = normalizarAlternativa(respostaEscolhida);
      const respostaCerta = normalizarAlternativa(questao.resposta);
      resultado = (respostaUsuario !== null && respostaUsuario === respostaCerta) ? "acertou" : "errou";
      respostasLista[questao.indiceOriginal] = MAPA_POSICAO_LETRA[respostaUsuario] || "-";
    }

    pontos = pontos + pontuarQuestao(cfg, total, resultado);
    if (resultado === "acertou") acertos += 1;
    atualizarProgresso({ acao: resultado, pontos: pontos, acertos: acertos });
    gravarTentativa(nomeQuiz, { respostas: respostasLista.slice(), acertos: acertos, nota: Math.round(pontos * 100) / 100, saidas: SAIDAS_QUIZ, data: new Date().toISOString() });

    const feedback = document.createElement("p");
    if (resultado === "acertou") {
      feedback.textContent = "Correto!"; feedback.className = "destaque-texto"; somAcerto();
    } else if (resultado === "pulou") {
      feedback.textContent = respostaEscolhida === "TEMPO" ? "Tempo esgotado!" : "Você pulou.";
      feedback.className = "erro-texto";
      fila.push(questao);
    } else {
      feedback.textContent = resultado === "errou" ? "Errado!" : "Tempo esgotado!";
      feedback.className = "erro-texto";
      somErro();
      const indiceCerta = parseInt(normalizarAlternativa(questao.resposta) || "0", 10) - 1;
      const alternativaCerta = questao.alternativas[indiceCerta];
      erros.push({
        item: questao.item,
        rotulo: alternativaCerta ? alternativaCerta.rotulo : "?",
        texto: alternativaCerta ? alternativaCerta.texto : "",
      });
    }
    corpoQ.appendChild(feedback);

    if (desafio && pontos >= cfg.meta) {
      atingiuMeta = true;
      const meta = document.createElement("p");
      meta.className = "destaque-texto";
      meta.textContent = `Meta de ${cfg.meta} pontos atingida!`;
      corpoQ.appendChild(meta);
    }

    await new Promise(resolver => { corpoQ.appendChild(criarBotao("Continuar", resolver)); });
    if (atingiuMeta) break;
  }

  atualizarProgresso({ acao: "terminou", pontos: Math.round(pontos * 100) / 100, acertos: acertos });
  encerrarQuizAtivo();
  pontos = Math.round(pontos * 100) / 100;
  const envioOk = await enviarResultado(nomeQuiz, gabaritoLista, respostasLista, acertos, pontos, cfg, atingiuMeta);
  await telaResultado(pontos, acertos, total, erros, envioOk, cfg, atingiuMeta);
}

async function telaResultado(pontos, acertos, total, erros, envioOk, cfg, atingiuMeta) {
  const corpo = cabecalho("Resultado");
  if (cfg.modo === "desafio") {
    await digitarParagrafo(corpo, `Pontos: ${fmt(pontos)} (meta ${cfg.meta})${atingiuMeta ? " - meta atingida!" : ""}`, "destaque-texto");
    await digitarParagrafo(corpo, `Acertos: ${acertos}`);
    if (!atingiuMeta) await digitarParagrafo(corpo, "Você respondeu todas as questões sem atingir a meta.");
  } else if (cfg.pontuacao === "dez") {
    await digitarParagrafo(corpo, `Nota final: ${pontos.toFixed(2)}`, "destaque-texto");
    await digitarParagrafo(corpo, `Acertos: ${acertos} de ${total}`);
  } else {
    await digitarParagrafo(corpo, `Pontos: ${fmt(pontos)} de ${total}`, "destaque-texto");
  }

  if (envioOk === true) await digitarParagrafo(corpo, "Resultado salvo.", "destaque-texto");
  else if (envioOk === false) await digitarParagrafo(corpo, "Não foi possível salvar o resultado (verifique a internet).", "erro-texto");

  if (erros.length > 0) {
    corpo.appendChild(linhaOrnamento("-"));
    await digitarParagrafo(corpo, "Revisão:", "destaque-texto");
    for (const erro of erros) {
      await digitarParagrafo(corpo, erro.item);
      await digitarParagrafo(corpo, `Resposta certa: ${erro.rotulo} - ${erro.texto}`);
    }
  }
  corpo.appendChild(criarBotao("Voltar ao início", telaMenu));
}

aplicarTema(CONFIG.tema);
carregarTrilhas();
telaIntro();
</script>
